services:
  # --------------------------------------------------
  # Backend Web Service (FastAPI)
  # --------------------------------------------------
  - type: web
    name: maitri-prod-backend
    env: python
    region: oregon
    buildCommand: cd backend && pip install --no-cache-dir -r requirements.txt
    startCommand: cd backend && python main.py
    healthCheckPath: /health
    instanceCount: 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CORS_ORIGINS
        value: https://maitri-v6-frontend.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"

  # --------------------------------------------------
  # Frontend Web Service (Next.js)
  # --------------------------------------------------
  - type: web
    name: maitri-v6-frontend
    env: node
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://maitri-v6-backend.onrender.com
