version: '3.8'

services:
  backend:
    build: .
    container_name: maitri-backend
    env_file: .env
    expose:
      - "8000"
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G # Prevent ML models from exhausting host RAM

  nginx:
    image: nginx:alpine
    container_name: maitri-nginx
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: always
